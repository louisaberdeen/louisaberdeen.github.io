<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Louis Aberdeen</title>
  <style>
    header { height: 10rem; overflow: hidden; margin-bottom: 1rem; }
    header h1 { margin-top: 0; }
    #log { margin: 0; font: 0.75rem/1.2 Menlo, Consolas, 'DejaVu Sans Mono', monospace; white-space: pre-wrap; word-break: break-all; color: #666; }
    body { max-width: 40rem; margin: 4rem auto; padding: 0 1rem; font: 1.1rem/1.6 system-ui, sans-serif; }
  </style>
</head>
<body>
  <header>
    <h1>Louis Aberdeen</h1>
    <pre id="log"></pre>
  </header>
  <ul>
    <li><a href="/info">Links</a></li>
    <li><a href="/jaxformer/" target="_blank">Jaxformer</a>: notes on understanding transformers (work in progress)</li>
    <li><a href="/are-nets-already-clean/" target="_blank">How clean are neural nets, how long is a piece of string?</a>: reading notes on superposition and interpretability (work in progress)</li>
  </ul>
  <script>
    const header = document.querySelector('header');
    const log = document.getElementById('log');
    let epoch = 1, step = 0, loss = 2.5;
    const N = 50, W = 20;
    setTimeout(() => setInterval(() => {
      step++;
      loss *= 0.999;
      const x = step / N * W, full = Math.floor(x), part = Math.floor((x - full) * 8);
      const bar = ('█'.repeat(full) + (part ? ' ▏▎▍▌▋▊▉'[part] : '')).padEnd(W);
      const pct = String(Math.round(step / N * 100)).padStart(3);
      log.textContent += `Epoch ${String(epoch).padStart(3)}:${pct}%|${bar}| ${String(step).padStart(2)}/${N} [loss=${loss.toFixed(4)}] `;
      if (step === N) { if (epoch % 100 === 0) log.textContent += "\nhere\n"; step = 0; epoch++; }
      if (log.textContent.length > 20000) log.textContent = log.textContent.slice(-10000);
      header.scrollTop = header.scrollHeight;
    }, 90), 2000);
  </script>
</body>
</html>
